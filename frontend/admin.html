<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>クイズ管理者ページ</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <h1>クイズ管理者ページ</h1>
      <p id="status" class="status" role="status"></p>

      <!-- 未ログイン時のログインプロンプト -->
      <section id="login-view" hidden>
        <p>クイズを登録するにはログインが必要です。</p>
        <button type="button" id="login-btn" class="btn primary">ログイン</button>
        <p>
          <a href="index.html">クイズアプリに戻る</a>
        </p>
      </section>

      <!-- ログイン済みの管理エリア -->
      <section id="admin-view" hidden>
        <div class="admin-toolbar">
          <button type="button" id="logout-btn" class="btn">ログアウト</button>
          <a href="index.html">クイズアプリに戻る</a>
        </div>

        <h2>新しいクイズを登録</h2>
        <form id="admin-form">
          <div class="admin-field">
            <label for="quiz-title-input">タイトル</label>
            <input
              type="text"
              id="quiz-title-input"
              class="admin-input"
              placeholder="例: AWS アーキテクチャ基礎"
              autocomplete="off"
            />
          </div>

          <div class="admin-field">
            <label for="quiz-id-input">クイズ ID（任意 / 半角英数字とハイフン）</label>
            <input
              type="text"
              id="quiz-id-input"
              class="admin-input"
              placeholder="例: my-aws-quiz（未入力なら自動採番）"
              autocomplete="off"
            />
          </div>

          <div id="admin-questions"></div>

          <button type="button" id="add-question-btn" class="btn">
            問題を追加
          </button>
          <button type="submit" class="btn primary">登録する</button>
        </form>

        <div id="admin-result" class="admin-result" hidden></div>
      </section>
    </main>

    <script src="config.js"></script>
    <script src="admin.js"></script>
  </body>
</html>
