# AWS Amplify Hosting ビルド仕様（Hosting のみ / バックエンドは使わない）
#
# このフロントエンドは依存関係ゼロのバニラ JS SPA なので npm ビルドは不要です。
# ビルドフェーズでは、Amplify コンソールに設定した環境変数から frontend/config.js を
# 生成し、実際の API/Cognito 値を注入します。
#
# 必要な環境変数（Amplify コンソール > アプリケーションの設定 > 環境変数）:
#   - API_BASE          = CDK CfnOutput の ApiEndpoint + '/api'
#                         例: https://xxxx.execute-api.<region>.amazonaws.com/api
#   - COGNITO_DOMAIN    = CDK CfnOutput の UserPoolHostedUiDomain
#                         例: https://<prefix>.auth.<region>.amazoncognito.com
#   - COGNITO_CLIENT_ID = CDK CfnOutput の UserPoolClientId
#
# 注意: リポジトリにコミットされている frontend/config.js はローカル開発用の
# プレースホルダーです。Amplify のビルドはこのファイルを上書きし、上記の
# 環境変数の値で config.js を再生成します（artifacts に含まれるのは生成後の内容）。
version: 1
frontend:
  phases:
    preBuild:
      commands:
        # ビルド前処理は不要（静的 SPA、npm ビルドなし）。
        - echo "No preBuild step - static SPA, no npm build."
    build:
      commands:
        # 環境変数から frontend/config.js を生成し、コミット済みの
        # プレースホルダーを上書きする。
        - echo "Generating frontend/config.js from Amplify environment variables..."
        - |
          cat > frontend/config.js <<EOF
          // このファイルは Amplify のビルド時に amplify.yml が自動生成しています。
          // 手動編集しないでください（ローカル開発用のプレースホルダーは Git 管理下にあります）。
          window.API_BASE = "${API_BASE}";
          window.COGNITO_DOMAIN = "${COGNITO_DOMAIN}";
          window.COGNITO_CLIENT_ID = "${COGNITO_CLIENT_ID}";
          EOF
        - echo "Generated frontend/config.js:"
        - cat frontend/config.js
  artifacts:
    # frontend/ ディレクトリ配下の全ファイルを配信対象にする。
    baseDirectory: frontend
    files:
      - '**/*'
  cache:
    paths: []
